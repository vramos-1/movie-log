# Dev profile: file-based H2 so data persists between restarts.
# Activate with: ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev

spring.datasource.url=jdbc:h2:file:./data/movielog;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema evolves automatically; existing data is preserved.
spring.jpa.hibernate.ddl-auto=update

# H2 web console available at http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
